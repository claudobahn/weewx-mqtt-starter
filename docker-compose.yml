name: weewx-mqtt

# Cap container log growth. weewx logs every loop packet at INFO, so with
# Docker's default json-file driver and no limit it would fill the disk on a
# long-running host. Applied to the always-on services below (and inherited by
# the prod overlay, since it overrides those services rather than replacing them).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------------
  # MQTT broker. Bridges the rtl_433/OMG sensor feed, WeeWX (subscribe driver +
  # publish), and the browser (over websockets, port 9001).
  # ----------------------------------------------------------------------
  mqtt:
    image: eclipse-mosquitto:2.0.22
    container_name: weewx-mqtt-broker
    restart: unless-stopped
    logging: *default-logging
    # 1883 is LAN-reachable so a real OMG (or any rtl_433 publisher on the local
    # network) can publish without extra config. Plaintext on the wire, but the
    # broker enforces auth + per-account ACLs. 9001 (browser/skin WebSocket)
    # stays loopback -- a remote browser uses the prod overlay's wss via Caddy.
    # Production replaces this with TLS-only public exposure (Mosquitto 8883 +
    # Caddy 443) via `ports: !override` in docker-compose.prod.yml.
    ports:
      - "0.0.0.0:1883:1883"     # plain MQTT  (LAN-reachable, auth required)
      - "127.0.0.1:9001:9001"   # MQTT over WebSockets (browser, host-local)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/data:/mosquitto/data
    environment:
      # Used only by the healthcheck below (mosquitto itself reads passwords
      # from the file). The `health` account is read-only on a single retained
      # $SYS topic -- a least-privilege internal probe, generated by setup.sh.
      MQTT_HEALTH_USER: ${MQTT_HEALTH_USER:-}
      MQTT_HEALTH_PASS: ${MQTT_HEALTH_PASS:-}
    healthcheck:
      # Prove the listener + auth are up by subscribing to a retained $SYS topic
      # (mosquitto publishes $SYS/broker/uptime with retain=true, so a fresh sub
      # gets the last value immediately -- no waiting for the next broadcast).
      # `$$` escapes Compose substitution so the literal `$VAR` reaches the shell
      # for runtime expansion. `-W 3` is a safety net in case retention ever
      # breaks (would otherwise block). weewx waits for healthy via
      # depends_on: condition: service_healthy, so the MQTTSubscribe driver's
      # one-shot DNS+connect at init can't race the broker's startup.
      # Timing: probe every 5s, fail-fast after 3 misses (15s), with a 10s
      # cold-start grace so a slower mosquitto boot doesn't get a false alarm.
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u \"$$MQTT_HEALTH_USER\" -P \"$$MQTT_HEALTH_PASS\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------
  # WeeWX engine. Primary driver is weewx-mqtt/subscribe (consuming the rtl_433
  # feed); weewx-mqtt/publish re-emits loop packets; generates the fuzzy-archer
  # (Bootstrap) report. The image entrypoint forwards args to `weectl`; with no
  # args it runs `weewxd`. Station, extensions and Python deps are baked into
  # the image (weewx/Dockerfile); the container seeds /data on first run.
  # ----------------------------------------------------------------------
  weewx:
    build:
      context: .
      dockerfile: weewx/Dockerfile
      args:
        WEEWX_VERSION: ${WEEWX_VERSION:-5.3.1}
    image: weewx-mqtt-local:5.3.1
    container_name: weewx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      # Wait until mosquitto is actually serving (not just the container being
      # created) -- the MQTTSubscribe driver does DNS+connect once at init, no
      # retry. See the mqtt service's healthcheck above.
      mqtt:
        condition: service_healthy
    # First-run bootstrap (entrypoint -> configure.py) reads these. Secrets +
    # overlay-controlled knobs only; station identity, sensors, qc, etc. live
    # in station.yaml.
    environment:
      WEEWX_WS_URL: ${WEEWX_WS_URL:-}            # prod overlay sets wss://${DOMAIN}
      MQTT_WEEWX_USER: ${MQTT_WEEWX_USER:-}
      MQTT_WEEWX_PASS: ${MQTT_WEEWX_PASS:-}
      MQTT_DASH_USER: ${MQTT_DASH_USER:-}
      MQTT_DASH_PASS: ${MQTT_DASH_PASS:-}
    volumes:
      - ./data:/data                       # WeeWX root (config, db, reports)
      - ./configure.py:/configure.py:ro    # one-shot config patcher
      - ./station.yaml:/station.yaml:ro    # the deployment's configurable config
      - ./branding:/branding:ro            # logo / about / nav / footer (station.yaml branding:)
      - ./user:/user:ro                    # custom Python modules (station.yaml services:)

  # ----------------------------------------------------------------------
  # Web server for the generated report (fuzzy-archer output), via Caddy.
  # Dev: plain HTTP on localhost:8080; the browser's live gauges connect straight
  # to the broker (mqtt:9001), not through here. The prod overlay swaps in
  # Caddyfile.prod so this same service terminates TLS + wss on 80/443.
  # ----------------------------------------------------------------------
  web:
    image: caddy:2.11.3-alpine
    container_name: weewx-web
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - weewx
    # Localhost-only in dev: http://localhost:8080/ (prod binds 80/443; see overlay).
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/public_html:/srv:ro

  # ----------------------------------------------------------------------
  # mcsc-publisher (BRANCH-SPECIFIC): synthetic MCSC weather-station data source.
  # Publishes realistic JSON to home/mcsc/wx every ~16 s as the omg account,
  # standing in for the real station's OMG/rtl_433 feed until hardware (or a
  # bridge from whatever transport the station uses) publishes to the same
  # topic. Stop / remove this service once real data is flowing.
  # ----------------------------------------------------------------------
  mcsc-publisher:
    image: eclipse-mosquitto:2.0.22
    container_name: weewx-mcsc-publisher
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mqtt:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/publisher/publish-mcsc.sh"]
    volumes:
      - ./mcsc-publisher:/publisher:ro
    environment:
      MQTT_HOST: mqtt
      MQTT_USER: ${MQTT_OMG_USER:-}
      MQTT_PASS: ${MQTT_OMG_PASS:-}

  # ----------------------------------------------------------------------
  # MQTTX Web: browser-based MQTT client for inspecting/publishing. Opt-in dev
  # tool (publish-capable) -- NOT started by default. Run it with:
  #   docker compose --profile tools up -d mqtt-ui
  # Then open http://localhost:8083 -> New Connection -> Host: localhost,
  # Port: 9001, Protocol: ws, Path: / and log in with an account from .env
  # (e.g. the weewx account). Bound to localhost only.
  # ----------------------------------------------------------------------
  mqtt-ui:
    image: emqx/mqttx-web:v1.13.0
    container_name: weewx-mqtt-ui
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      - mqtt
    ports:
      - "127.0.0.1:8083:80"

# station.yaml — the single source of configurable truth for this deployment.
# Secrets (MQTT account passwords, ACME email) stay in .env; configuration and
# customization live here.
#
# Read by configure.py at first-run bootstrap. To re-apply after editing on an
# existing stack:
#     docker compose run --rm --entrypoint python weewx /configure.py
#     docker compose restart weewx

# ── Identity ───────────────────────────────────────────────────────────────
station:
  location: "Sailing Center"
  latitude: 37.808
  longitude: -122.409
  altitude:
    value: 3
    unit: foot                 # foot | meter
  archive_interval: 60         # seconds (rtl_433 sensors transmit every ~9-16 s)

# ── MQTT broker (the driver subscribes and publish writes here) ───────────
mqtt:
  broker: mqtt                 # docker service name; reachable over the docker network
  port: 1883
  # WebSocket URL embedded in the public dashboard for live gauges. The
  # WEEWX_WS_URL env var (set by overlays — prod uses wss://${DOMAIN}) wins
  # over this value when present.
  websocket_url: "ws://localhost:9001"

# ── Data ingestion (rtl_433 → WeeWX fields) ───────────────────────────────
# Edit `sources` to match your sensors. Defaults describe a Fine Offset WS80
# primary station and an Ambient Weather WH31B thermo-hygrometer relayed by
# OpenMQTTGateway. See README "Multiple sensors" for the per-source schema.
sensors:
  unit_system: US              # US | METRIC | METRICWX
  sources:
    - name: primary
      topic: home/+/RTL_433toMQTT/Fineoffset-WS80/+
      fields:
        temperature_C: { name: outTemp,     units: degree_C }
        humidity:      { name: outHumidity }
        wind_avg_m_s:  { name: windSpeed,   units: meter_per_second }
        wind_max_m_s:  { name: windGust,    units: meter_per_second }
        wind_dir_deg:  { name: windDir }
        uvi:           { name: UV }
        rain_mm:       { name: rain, units: mm, contains_total: true }   # WS90 only
    - name: wh31b-ch1
      topic: home/+/RTL_433toMQTT/AmbientWeather-WH31B/+
      msg_id_field: channel    # field per channel: temperature_C_<n>, humidity_<n>
      fields:
        temperature_C_1: { name: extraTemp1, units: degree_C }
        humidity_1:      { name: extraHumid1 }

# ── Quality-control bounds (drop spoofed / out-of-range / inf/nan values) ─
# weewx ships defaults for outTemp/outHumidity/windSpeed/barometer/etc.; the
# rest of this stack's observations get bounded here. Tune to your climate.
qc:
  windGust:    { min: 0,   max: 120, unit: mile_per_hour }
  windDir:     { min: 0,   max: 360, unit: degree_compass }
  UV:          { min: 0,   max: 20 }
  extraTemp1:  { min: -40, max: 120, unit: degree_F }    # WH31B
  extraHumid1: { min: 0,   max: 100 }

# ── Optional sections ─────────────────────────────────────────────────────
#
# observations: []        # custom obs types -> generated user/extra_obs.py
# schema: { ... }         # custom DB schema -> generated user/extra_schema.py
# units: { ... }          # display unit overrides per unit group
# labels: { ... }         # [Labels][Generic] display-name overrides
# datetime_formats: {...} # date/time format strings
#
# branding:               # user-provided files copied into the skin (./branding/)
#   site_name: "Your Org"               # informational; for your own HTML to reference
#   site_url:  "https://example.org"
#   logo:                logo.png        # -> skins/Bootstrap/images/logo.png
#   about_page:          about.html.tmpl # -> skins/Bootstrap/about.html.tmpl
#   nav_fragment:        nav.html.inc    # -> skins/Bootstrap/nav.html.inc
#   footer_fragment:     foot.html.inc   # -> skins/Bootstrap/foot.html.inc
#   livegauges_fragment: livegauges.html.inc
#   images:                              # extras copied to skins/Bootstrap/images/
#     - deployment.jpg
#
# logging:                # [Logging] section -- handlers + formatters + root
#   root:
#     level: INFO
#     handlers: [console, timed_rotate]
#   handlers:
#     timed_rotate:
#       class: logging.handlers.TimedRotatingFileHandler
#       level: DEBUG
#       formatter: verbose
#       filename: "logs/{process_name}.log"
#       when: midnight
#       backupCount: 7
#   # formatters: { ... }   # optional, weewx defines "verbose" and "simple" already
#
# services:               # extra entries in weewx's *_services chains;
#   prep:    [user.mast_obs.MASTObservations]   # files must live in ./user/<name>.py
#   data:    []
#   restful: []

# ── Dashboard overrides (fuzzy-archer skin) ───────────────────────────────
# Each subsection overrides the same-named section in skin.conf. Omit a key to
# keep the skin's default. Omit `dashboard:` entirely to keep ALL the defaults.
# Re-runs of configure.py are idempotent (sections are cleared and rebuilt).
#
# Uncomment and adjust:
#
# dashboard:
#   # Top nav + sidebar
#   navigation:   [index, stats, history, news, about]
#   station_info: [location, sunRiseSet, moonphase, uptime]
#
#   # Stats / history tabs
#   stats:
#     items: [wind, outTemp, outHumidity]
#     aggregations:
#       outHumidity: [avg]               # adds [[[[outHumidity]]]] [[[[[avg]]]]]
#   history:
#     items: [max_wind, NOAA]
#
#   # News entries (one [[[[<title>]]]] subsection each)
#   news:
#     - date: "May 5, 2025"              # used as the subsection title
#       header: "Buoy Deployed"
#       body:   "The Marquette team deployed the buoy in calm conditions."
#       img:    { src: "images/deployment.jpg", alt: "Buoy crew" }
#
#   # Browser-side gauges. `range:` and `payload_key` are semantic; everything
#   # under `style:` (and any extra top-level keys on a gauge) passes through to
#   # fuzzy-archer verbatim -- see skin.conf [LiveGauges] for the full key list.
#   live_gauges:
#     items: [windSpeed, windDir]        # ordering; defaults to keys of `gauges`
#     gauges:
#       windSpeed:
#         payload_key: windSpeed_knot    # match your unit_system / [StdConvert]
#         range: { min: 0, max: 50, splitnumber: 10 }
#         style:
#           lineColor:      ["#428bca", "#b44242"]
#           lineColorUntil: [22, maxvalue]   # strong-breeze threshold
#           decimals: 1
#       windDir:                         # circular direction gauge
#         payload_key: windDir
#         style: { lineColorN: "#428bca", lineColorS: "#b44242", decimals: 0 }
#
#   # Browser-side line/scatter charts. Two-level nesting: chart -> series.
#   live_charts:
#     items: [wind]
#     show_daynight: true                # any chart-level keys pass through
#     charts:
#       wind:
#         series:
#           - { obs: windSpeed, payload_key: windSpeed_mph, style: { decimals: 0 } }
#           - { obs: windGust,  payload_key: windGust_mph,  style: { showMaxMarkPoint: true } }
#
#   # Static day/week/month/year PNG plots from weewx's ImageGenerator.
#   image_plots:
#     common:                            # keys at [[[ImageGenerator]]] root
#       daynight_day_color:   "0xffffff"
#       daynight_night_color: "0xf0f0f0"
#     day:
#       style: { line_type: "none", marker_size: 3, marker_type: "cross" }
#       items:
#         dayWind:    { yscale: [0, null, 1.0], series: [windSpeed] }
#         dayWindDir: { yscale: [0, 360, 45.0], series: [windDir] }
#     week:
#       style: { aggregate_interval: 600 }
#       items:
#         weekWind:
#           yscale: [0, null, 1.0]
#           series:
#             - windSpeed                # bare obs name -> empty subsection
#             - { obs: windGust, aggregate_type: max }

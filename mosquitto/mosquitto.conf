# Mosquitto broker for the WeeWX MQTT stack.
#
# Listeners:
#   1883  plain MQTT (TCP) - WeeWX (subscribe driver + publish), OMG / e2e-test.sh
#   9001  MQTT over WebSockets - the fuzzy-archer skin running in the browser
#
# Authentication is ON: every client must present credentials (see ./passwd,
# generated by setup.sh into the gitignored mosquitto/passwd) and is constrained
# by per-account ACLs (./acl). Three accounts: omg (publish-only sensor feed),
# weewx (read home/#, write weather/#), dashboard (read-only weather/loop).
#
# Listeners are plaintext here; TLS is added in the production profile
# (docker-compose.prod.yml) by terminating at Caddy / a TLS listener on 8883.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

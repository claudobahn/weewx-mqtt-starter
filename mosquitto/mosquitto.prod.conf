# Production Mosquitto config: mirrors mosquitto.conf (1883 mqtt + 9001 ws, auth,
# ACLs, persistence) and ADDS a TLS MQTT listener on 8883 for OpenMQTTGateway.
# Selected via the `command:` override in docker-compose.prod.yml. Keep the
# shared settings here in sync with mosquitto.conf.

listener 1883
protocol mqtt

listener 9001
protocol websockets

# MQTTS for OMG. cert/key are maintained by the cert-reload sidecar, which
# copies Caddy's Let's Encrypt cert here and SIGHUPs mosquitto on renewal.
# A self-signed bootstrap cert must exist before first start (see README).
listener 8883
protocol mqtt
certfile /mosquitto/certs/mqtt.crt
keyfile /mosquitto/certs/mqtt.key

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
